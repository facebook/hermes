name: RN Build Static Hermes

on:
  workflow_dispatch:
    inputs:
      release-type:
        required: false
        description: 'Release type (release, dry-run)'
        type: choice
        options:
          - release
          - dry-run
        default: 'dry-run'
      update-latest-v1:
        required: false
        description: 'Update latest-v1 (unchecked leaves the npm tag unchanged)'
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - 250829098.0.0-stable

jobs:
  set_release_type:
    runs-on: ubuntu-latest
    if: github.repository == 'facebook/hermes'
    outputs:
      RELEASE_TYPE: ${{ steps.set_release_type.outputs.RELEASE_TYPE }}
      HERMES_VERSION: ${{ steps.generate_version.outputs.HERMES_VERSION }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      REF: ${{ github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node.js
        uses: ./.github/actions/setup-node
      - name: Install node dependencies
        uses: ./.github/actions/yarn-install
      - id: set_release_type
        run: |
          if [[ $EVENT_NAME == "workflow_dispatch" ]]; then
            echo "Setting release type to ${{ github.event.inputs.release-type }}"
            echo "RELEASE_TYPE=${{ github.event.inputs.release-type }}" >> $GITHUB_OUTPUT
          else
            echo "Setting release type to dry-run"
            echo "RELEASE_TYPE=dry-run" >> $GITHUB_OUTPUT
          fi
      - id: generate_version
        run: |
          VERSION=$(node ./utils/scripts/hermes/get-hermes-version.js --build-type ${{ steps.set_release_type.outputs.RELEASE_TYPE }})
          echo "Generated version: $VERSION"
          echo "HERMES_VERSION=$VERSION" >> $GITHUB_OUTPUT
  build_hermesc_apple:
    uses: ./.github/workflows/build-hermesc-apple.yml
  build_apple_slices_hermes:
    uses: ./.github/workflows/build-apple-slices-hermes.yml
    needs: build_hermesc_apple
  build_hermes_macos:
    uses: ./.github/workflows/build-hermes-macos.yml
    needs: build_apple_slices_hermes
  build_hermesc_linux:
    uses: ./.github/workflows/build-hermesc-linux.yml
  build_hermesc_windows:
    uses: ./.github/workflows/build-hermesc-windows.yml
  build_android:
    uses: ./.github/workflows/build-android.yml
    needs: set_release_type
    secrets: inherit
    with:
      release-type: ${{ needs.set_release_type.outputs.RELEASE_TYPE }}
  publish:
    runs-on: 8-core-ubuntu
    needs:
      [
        set_release_type,
        build_hermes_macos,
        build_hermesc_linux,
        build_hermesc_windows,
      ]
    # `id-token: write` lets the npm CLI mint the OIDC token that npm Trusted
    # Publishing exchanges for a short-lived publish token. Scoped to this job
    # so the tag-pushing jobs keep their own permissions.
    permissions:
      contents: read
      id-token: write
    environment: npm-publish
    container:
      image: reactnativecommunity/react-native-android:latest
      env:
        TERM: "dumb"
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    env:
      HERMES_WS_DIR: /tmp/hermes
      ORG_GRADLE_PROJECT_SIGNING_PWD: ${{ secrets.ORG_GRADLE_PROJECT_SIGNING_PWD }}
      ORG_GRADLE_PROJECT_SIGNING_KEY: ${{ secrets.ORG_GRADLE_PROJECT_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_SONATYPE_USERNAME: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPE_USERNAME }}
      ORG_GRADLE_PROJECT_SONATYPE_PASSWORD: ${{ secrets.ORG_GRADLE_PROJECT_SONATYPE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup git safe folders
        shell: bash
        run: git config --global --add safe.directory '*'
      - name: Create /tmp/hermes/osx-bin directory
        shell: bash
        run: mkdir -p /tmp/hermes/osx-bin
      - name: Download osx-bin release artifacts
        uses: actions/download-artifact@v4
        with:
          name: hermes-osx-bin-Release
          path: /tmp/hermes/osx-bin/Release
      - name: Download osx-bin debug artifacts
        uses: actions/download-artifact@v4
        with:
          name: hermes-osx-bin-Debug
          path: /tmp/hermes/osx-bin/Debug
      - name: Download darwin-bin release artifacts
        uses: actions/download-artifact@v4
        with:
          name: hermes-darwin-bin-Release
          path: /tmp/hermes/hermes-runtime-darwin
      - name: Download darwin-bin debug artifacts
        uses: actions/download-artifact@v4
        with:
          name: hermes-darwin-bin-Debug
          path: /tmp/hermes/hermes-runtime-darwin
      - name: Download hermes dSYM debug artifacts
        uses: actions/download-artifact@v4
        with:
          name: hermes-dSYM-Debug
          path: /tmp/hermes/dSYM/Debug
      - name: Download hermes dSYM release vartifacts
        uses: actions/download-artifact@v4
        with:
          name: hermes-dSYM-Release
          path: /tmp/hermes/dSYM/Release
      - name: Download linux-bin artifacts
        uses: actions/download-artifact@v4
        with:
          name: hermes-linux-bin
          path: /tmp/hermes/linux64-bin
      - name: Download windows-bin artifacts
        uses: actions/download-artifact@v4
        with:
          name: hermes-win64-bin
          path: /tmp/hermes/win64-bin
      - name: Show /tmp/hermes directory
        shell: bash
        run: ls -lR /tmp/hermes
      - name: Setup node.js
        uses: ./.github/actions/setup-node
      # npm Trusted Publishing needs npm >= 11.5.1 to mint the OIDC token.
      # ./.github/actions/setup-node pins node 22.14.0 on this branch, which
      # ships npm 10.9.2. Runs before the Maven publish so a tooling problem
      # here does not leave a version half-released.
      - name: Upgrade npm for trusted publishing
        shell: bash
        run: |
          npm install -g npm@11
          npm --version
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Copy Hermes binaries
        shell: bash
        run: |
          node ./utils/scripts/hermes/prepare-artifacts.js
      - name: Print Artifacts Directory
        shell: bash
        run: ls -lR ./android/ios-artifacts/artifacts/
      - name: Publish artifacts
        shell: bash
        run: |
          node ./utils/scripts/hermes/publish-artifacts.js -t ${{ needs.set_release_type.outputs.RELEASE_TYPE }}
      # NB: npm matches the `workflow_ref` OIDC claim, which is the top-level
      # workflow filename (rn-build-hermes.yml). This step must stay inlined
      # here and must not move back into a reusable workflow.
      - name: Publish to npm
        shell: bash
        run: |
          node ./utils/scripts/hermes/publish-npm.js \
            -t ${{ needs.set_release_type.outputs.RELEASE_TYPE }} \
            --update-latest-v1=${{ github.event_name == 'workflow_dispatch' && inputs.update-latest-v1 }}
      - name: Upload npm logs
        if: always()
        uses: actions/upload-artifact@v4.3.4
        with:
          name: npm-logs
          path: ~/.npm/_logs
  create-tag:
    uses: ./.github/workflows/create-tag.yml
    needs: set_release_type
    with:
      release-type: ${{ needs.set_release_type.outputs.RELEASE_TYPE }}
      hermes-version: ${{ needs.set_release_type.outputs.HERMES_VERSION }}
