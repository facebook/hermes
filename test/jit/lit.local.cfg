# The tests in this directory currently assume the arm64 backend's opcode
# coverage; the x86-64 backend is under bring-up and declines most
# functions, which breaks the -Xjit-crash-on-error RUN lines. Gate the
# directory to arm64 until x86-64 coverage lands; x86-64 bring-up tests
# live in the x86-64/ subdirectory.
if "jit-arch-arm64" not in config.available_features:
    config.unsupported = True
