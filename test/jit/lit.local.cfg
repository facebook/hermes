# As of milestone 5 the x86-64 backend has reached arm64's full opcode
# surface (only AsyncBreakCheck stays permanently unsupported, on both
# backends), so the "x86-64 declines most functions" rationale that used
# to justify this gate no longer holds. The gate stays anyway: this
# directory was authored against arm64 and has not been audited for
# arm64-only assumptions (golden dumps, timing, register-budget-specific
# shapes, etc.), and un-gating it for x86-64 without goldens is milestone
# 6's job, not something to do informally here. x86-64's own tests, which
# do not carry that baggage, live in the x86-64/ subdirectory.
if "jit-arch-arm64" not in config.available_features:
    config.unsupported = True
